# Factory v2 project configuration. Roles come from the harness defaults
# (~/factory/src/factory/config.py): llama-server on :8080, qwen3.8-flash-next.
# Add [roles.<name>] here only after a `factory bench` says another model is better.
[run]
test_command = ['php', 'vendor/bin/phpunit', '-c', 'phpunit.xml']
iterations_per_contract = 12
max_run_iterations = 400

# Šablony se píšou rukou, protože brána nad vzhledem nerozhodne — o jejich
# přeložitelnosti ale rozhodne, a tenhle test to dělá. Kontrakt na něj proto
# není a ve výpisu sirotků má stát jako „schválně rukou", ne jako nevysvětlený.
[check]
rukou = ["web/modules/hwdesk/tests/src/Unit/TemplatesParseTest.php"]
