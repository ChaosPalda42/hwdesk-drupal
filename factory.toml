# Factory v2 project configuration. Roles map to local LM Studio models.
[run]
test_command = ['php', 'vendor/bin/phpunit', '-c', 'phpunit.xml']
iterations_per_contract = 12
max_run_iterations = 400

[roles.coder]
model = "openai/gpt-oss-120b"
context_length = 65536
slots = 2

[roles.tester]
model = "openai/gpt-oss-120b"
context_length = 65536
slots = 1

[roles.triage]
model = "openai/gpt-oss-120b"
context_length = 65536
slots = 1
