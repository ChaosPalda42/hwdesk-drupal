api_csobrec.settings:
  type: config_object
  label: 'Předávka nahrávek ČSOB'
  mapping:
    klic:
      type: string
      label: 'Klíč modulu Key s přístupy'
    fronty:
      type: sequence
      label: 'Fronty a jejich režim'
      sequence:
        type: string
        label: 'Režim (VSE nebo LOGIKA)'
    hodina:
      type: integer
      label: 'Hodina ranní předávky'
    sftp_cil:
      type: string
      label: 'Cílová cesta na jejich serveru'
    sftp_otisk:
      type: string
      label: 'Očekávaný otisk klíče serveru'
    sftp_overit_klic:
      type: boolean
      label: 'Ověřovat klíč serveru'
    ffmpeg:
      type: string
      label: 'Cesta k ffmpegu'
    davky_dni:
      type: integer
      label: 'Po kolika dnech mazat dávky z disku'
