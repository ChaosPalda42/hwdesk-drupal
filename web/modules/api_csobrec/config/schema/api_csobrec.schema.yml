api_csobrec.settings:
  type: config_object
  label: 'Předávka nahrávek ČSOB'
  mapping:
    daktela_url:
      type: uri
      label: 'Adresa Daktely'
    fronty:
      type: sequence
      label: 'Fronty a jejich režim'
      sequence:
        type: string
        label: 'Režim (VSE nebo LOGIKA)'
    hodina:
      type: integer
      label: 'Hodina ranní předávky'
    sftp_host:
      type: string
      label: 'Adresa SFTP ČSOB'
    sftp_port:
      type: integer
      label: 'Port SFTP'
    sftp_uzivatel:
      type: string
      label: 'Přihlašovací jméno'
    sftp_cil:
      type: string
      label: 'Cílová cesta na jejich serveru'
    sftp_klic:
      type: string
      label: 'Cesta k privátnímu klíči'
    sftp_otisk:
      type: string
      label: 'Očekávaný otisk klíče serveru'
    sftp_overit_klic:
      type: boolean
      label: 'Ověřovat klíč serveru'
    ffmpeg:
      type: string
      label: 'Cesta k ffmpegu'
    davky_dni:
      type: integer
      label: 'Po kolika dnech mazat dávky z disku'
