# téhož telefonního čísla z téže fronty.
fronty: {}
hodina: 5
sftp_host: ''
sftp_port: 22
sftp_uzivatel: ''
sftp_cil: ''
sftp_klic: ''
sftp_otisk: ''
sftp_overit_klic: false
# Cesta k ffmpegu; prázdné = hledá se v PATH.
ffmpeg: ''
# Po kolika dnech se hotové dávky z disku mažou. 0 = nemazat.
davky_dni: 30
