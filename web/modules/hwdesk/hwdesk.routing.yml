hwdesk.dashboard:
  path: '/hwdesk'
  defaults:
    _controller: '\Drupal\hwdesk\Controller\DashboardController::page'
    _title: 'HW Desk'
  requirements:
    _permission: 'administer hwdesk'

hwdesk.my:
  path: '/hwdesk/my'
  defaults:
    _controller: '\Drupal\hwdesk\Controller\MyAssetsController::page'
    _title: 'Moje zařízení'
  requirements:
    _permission: 'view own hwdesk assets'

hwdesk.handover.confirm:
  # Odkaz z e-mailu. Totožnost dokládá sám odkaz: v databázi je jen jeho
  # kontrolní součet, platí jednou a jen do data vypršení. Přihlašovat se
  # kvůli potvrzení nikdo nemusí.
  path: '/hvd/{token}'
  defaults:
    _form: '\Drupal\hwdesk\Form\ConfirmHandoverForm'
    _title: 'Potvrzení převzetí'
  requirements:
    _access: 'TRUE'
    token: '[A-Za-z0-9_-]{16,128}'
  options:
    no_cache: TRUE

hwdesk.asset.handover:
  path: '/hwdesk/asset/{hwdesk_asset}/handover'
  defaults:
    _form: '\Drupal\hwdesk\Form\RequestHandoverForm'
    _title: 'Předat / vrátit'
  requirements:
    _custom_access: '\Drupal\hwdesk\Form\RequestHandoverForm::access'
  options:
    parameters:
      hwdesk_asset:
        type: entity:hwdesk_asset

hwdesk.asset.label:
  path: '/hwdesk/asset/{hwdesk_asset}/label'
  defaults:
    _controller: '\Drupal\hwdesk\Controller\LabelController::single'
    _title: 'Štítek'
  requirements:
    _permission: 'administer hwdesk'
  options:
    parameters:
      hwdesk_asset:
        type: entity:hwdesk_asset

hwdesk.labels:
  path: '/hwdesk/labels'
  defaults:
    _controller: '\Drupal\hwdesk\Controller\LabelController::sheet'
    _title: 'Štítky'
  requirements:
    _permission: 'administer hwdesk'

hwdesk.labels.zpl:
  path: '/hwdesk/labels/zpl'
  defaults:
    _form: '\Drupal\hwdesk\Form\PrintZplForm'
    _title: 'Tisk na Zebru'
  requirements:
    _permission: 'administer hwdesk'

hwdesk.qr:
  path: '/a/{tag}'
  defaults:
    _controller: '\Drupal\hwdesk\Controller\QrController::go'
  requirements:
    _user_is_logged_in: 'TRUE'
    tag: '[A-Za-z0-9-]+'

hwdesk.intake:
  path: '/hwdesk/intake'
  defaults:
    _form: '\Drupal\hwdesk\Form\IntakeForm'
    _title: 'Příjem zboží'
  requirements:
