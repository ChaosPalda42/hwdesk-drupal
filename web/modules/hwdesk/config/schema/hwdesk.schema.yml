hwdesk.settings:
  type: config_object
  label: 'HW Desk settings'
  mapping:
    asset_types:
      type: sequence
      label: 'Asset types: machine key => label'
      sequence:
        type: label
        label: 'Type label'
    tag_prefixes:
      type: sequence
      label: 'Inventory tag prefix per asset type'
      sequence:
        type: string
        label: 'Prefix'
    tag_pad:
      type: integer
      label: 'Minimum digits in the sequence part of an inventory tag'
    handover_token_hours:
      type: integer
      label: 'Hours a handover confirmation link stays valid'
    protocol_copy_to:
      type: string
      label: 'E-mail that receives a copy of every protocol'
    company_name:
      type: label
      label: 'Company name printed on protocols'
    label_printer_host:
      type: string
      label: 'Zebra printer host (port 9100); empty = browser printing only'
    base_url:
      type: string
      label: 'Absolute URL of the site for QR codes and e-mail links; empty = current request'
    mail_from:
      type: email
      label: 'Address the HW Desk mails are sent from; empty = site mail'
    mail_from_name:
      type: label
      label: 'Display name of the sender'
    mail_reply_to:
      type: email
      label: 'Reply-To address; empty = the sender address'
    smtp_enabled:
      type: boolean
      label: 'Send HW Desk mail through an own SMTP server'
    smtp_host:
      type: string
      label: 'SMTP host'
    smtp_port:
      type: integer
      label: 'SMTP port'
    smtp_security:
      type: string
      label: 'SMTP encryption: none, tls (STARTTLS) or ssl'
    smtp_user:
      type: string
      label: 'SMTP user name; empty = no authentication'
    smtp_key:
      type: string
      label: 'Id of the Key entity holding the SMTP password; the password itself is never in config'
    handover_terms:
      type: text
      label: 'Terms the employee has to agree with when taking a device over'
    return_terms:
      type: text
      label: 'Terms shown when returning a device; empty = the handover terms'
    handover_consent_label:
      type: label
      label: 'Wording of the consent checkbox'

action.configuration.hwdesk_asset_retire:
  type: action_configuration_default
  label: 'Retire assets configuration'
action.configuration.hwdesk_asset_lost:
  type: action_configuration_default
  label: 'Mark assets lost configuration'
action.configuration.hwdesk_asset_in_stock:
  type: action_configuration_default
  label: 'Assets back in stock configuration'
action.configuration.hwdesk_asset_labels:
  type: action_configuration_default
  label: 'Select assets for labels configuration'
